html,body{height:100%}

@keyframes nudge{0%,100%{box-shadow:0 0 0 2px #FF6A47}50%{box-shadow:0 0 0 6px rgba(255,106,71,0.28)}}
.say{animation:pop 260ms cubic-bezier(.2,.9,.3,1.25)}
.flashA{animation:flashA 1.2s ease-out 1}
.flashB{animation:flashB 1.2s ease-out 1}
@keyframes flashA{0%{box-shadow:0 0 0 3px #FFFFFF,0 0 0 6px #3A4BFF}100%{box-shadow:0 0 0 3px rgba(255,255,255,0),0 0 0 18px rgba(58,75,255,0)}}
@keyframes flashB{0%{box-shadow:0 0 0 3px #FFFFFF,0 0 0 6px #3A4BFF}100%{box-shadow:0 0 0 3px rgba(255,255,255,0),0 0 0 18px rgba(58,75,255,0)}}
.gifbox{animation:gifbg 1.2s steps(1) infinite}
@keyframes gifbg{0%{background-color:#FF6A47}50%{background-color:#FF8AD1}}
.fah{animation:fah .9s ease-in-out infinite}
@keyframes fah{0%,100%{transform:scale(1,1) rotate(-2deg)}35%{transform:scale(1.16,.9) rotate(2deg)}65%{transform:scale(.95,1.06) rotate(-1deg)}}

@keyframes pop{from{opacity:0;transform:scale(.85) translateY(-4px)}to{opacity:1;transform:none}}
.mp-label{position:absolute;left:15px;top:19px;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
[data-flip="1"] .mp-label{left:auto;right:14px;align-items:flex-end}
[data-flip="1"] .mp-pill{border-radius:10px 3px 10px 10px !important}
[data-flip="1"] .say{border-radius:16px 3px 16px 16px !important}
@media (hover:hover) and (pointer:fine){.mp-root,.mp-root *{cursor:none !important}}
@media (hover:none){.mp-me{display:none !important}}
.chat{display:flex;flex-direction:row}
.chat-side{width:252px}
.chat-list{display:flex;flex-direction:column;gap:2px}
@media (max-width:760px){
.chat{flex-direction:column}
.chat-side{width:auto}
.chat-list{flex-direction:row;flex-wrap:wrap;gap:6px}
.chat-main{min-height:460px}
.hide-sm{display:none !important}
}

.fullpost{margin-top:14px;padding-top:16px;border-top:1px solid #EAD9A0}
.fullpost>summary{display:flex;align-items:center;gap:10px;width:fit-content;list-style:none;cursor:pointer;font-weight:500;color:#16133A;border-radius:4px}
.fullpost>summary::-webkit-details-marker{display:none}
.fullpost>summary:hover{color:#3A4BFF}
.fullpost>summary:focus-visible{outline:2px solid #FFCB2E;outline-offset:4px}
.fullpost .chev{flex:none;color:#3A4BFF;transition:transform 160ms ease}
.fullpost[open] .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.fullpost .chev{transition:none}}
</style>

<li style="display: flex;"><button class="hit" type="button" aria-pressed="{{ r3.pressed }}" onClick="{{ r3.pick }}" style="width: 100%; display: flex; gap: 16px; padding: 0; border: 0; background: transparent; color: #16133A; font-family: 'Newsreader', Georgia, serif; font-size: 19px; line-height: 1.6; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 9px; height: 9px; margin-top: 11px; border-radius: 50%; background: #3A4BFF;"></span><span><span class="{{ r3.flash }}" style="background: {{ r3.hl }}; box-shadow: 0 0 0 3px {{ r3.hl }}; border-radius: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background 160ms ease, box-shadow 160ms ease;">Ideas. They don't all have to be great. You just need to have them.</span></span></button></li>

<p style="margin: 0;">Experience with consumer brands, technology, music, or culture is nice to have, but it's not the point.</p>
<p style="margin: 0;">We're much more interested in your book, your brain, and your potential than a perfectly linear résumé.</p>
<details class="fullpost">

<div style="display: flex; flex-direction: column; gap: 18px; padding-top: 22px;">
<p style="margin: 0;">At Sonos we want to create the ultimate listening experience for our customers and know that it starts by listening to each other. As part of the Sonos team, you’ll collaborate with people of all styles, skill sets, and backgrounds to realize our vision while fostering a community where everyone feels included and empowered to do the best work of their lives.</p>
<h2 style="margin: 18px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; color: #16133A;">This role is a hybrid position</h2>
<p style="margin: 0;">Some roles require an office while others may be done remotely. This position is considered hybrid, allowing for a combination of remote work and in-office collaboration. Qualified applicants must live within commuting distance of our New York office location.</p>
<h2 style="margin: 18px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; color: #16133A;">About BPM</h2>
<p style="margin: 0;">BPM — short for Bureau of Psychoacoustic Messaging — is the newly formed in-house creative engine for Sonos — the team behind brand campaigns, social content, and cultural moments that bring the Sonos listening experience to life. We move fast, think culturally, and care as much about how something feels as how it looks.</p>
<p style="margin: 0;">We're opening a new creative studio and performance space in SoHo, where we'll invite artists in for live performances, listening sessions, and film screenings.</p>
<h2 style="margin: 18px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; color: #16133A;">About the Role</h2>
<p style="margin: 0;">We're looking for a Junior Copywriter to join BPM and help make creative work for Sonos.</p>
<p style="margin: 0;">You’re early in your career, but you know you want to be a writer. You love words, ideas, culture, music, and advertising — and you probably pay more attention than most people to the way brands talk.</p>
<p style="margin: 0;">You'll work alongside writers, designers, and other creatives to come up with ideas and bring them to life across campaigns, social, product launches, retail, CRM, and whatever else we're making. Some assignments will be big. Some will be small. Sometimes you'll be writing headlines. Sometimes you'll be concepting with a designer. Sometimes you'll be figuring out how to say something complicated in five words.</p>
<p style="margin: 0;">You don't need to have it all figured out yet. We're looking for someone with talent, curiosity, and a point of view who's excited to learn from really good people and get better by making a lot of work.</p>
<h2 style="margin: 18px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; color: #16133A;">What You’ll Do</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;">
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Write. Headlines, scripts, social posts, emails, product stories, campaign copy, and whatever else the idea calls for.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Come up with ideas — on your own and alongside designers, writers, and other creatives.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Explore different ways into a brief instead of stopping at the first idea. Iterate.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Help turn creative concepts into work that feels clear, interesting, and distinctly Sonos.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Find interesting, human ways to talk about products and technology.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Learn the Sonos voice and help bring it to life across different kinds of work.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Work with more senior creatives to develop your ideas and your craft.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Take feedback, try again, and keep pushing the work.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Pay attention to what's happening in music, culture, design, advertising, and the internet — and bring that curiosity into the work.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>Juggle a few things at once and learn how to make good work on real-world timelines.</span></li>
</ul>
<h2 style="margin: 18px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; color: #16133A;">What Success Looks Like</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;">
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>You're making good work and getting better.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>You're curious. You ask questions. You bring ideas into the room. You're willing to try something weird, throw away something that isn't working, and take another swing.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>You care about craft, but you're not precious about your copy. You want feedback because you want the work to be better.</span></li>
<li style="display: flex; gap: 16px;"><span aria-hidden="true" style="flex: none; width: 6px; height: 6px; margin-top: 13px; border-radius: 50%; background: #16133A;"></span><span>And as you grow, you're taking on more, finding your voice, and becoming a stronger creative partner.</span></li>
</ul>
</div>
</details>
</div>

<span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 9px; background: #FFCB2E; color: #16133A; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;">A</span>
<div style="min-width: 0;">
<p style="margin: 0; font-size: 16px; font-weight: 600; color: #FFFFFF;">Ayanna HQ</p>
<p style="margin: 2px 0 0; font-size: 12.5px; color: #D4D0FF;">Thinking out loud, mostly.</p>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<p style="margin: 0; padding: 0 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #C9C4FF;">Channels</p>
<nav aria-label="Channels" class="chat-list">
<sc-for list="{{ channels }}" as="c" hint-placeholder-count="4">
<button class="chan" data-guide="ch-{{ c.id }}" type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 9px; background: {{ c.bg }}; color: {{ c.fg }}; font-size: 14.5px; font-weight: {{ c.fw }}; text-align: left; cursor: pointer;">
<span aria-hidden="true" style="font-weight: 700; color: {{ c.hashColor }};">#</span>
<span>{{ c.name }}</span>
</button>
</sc-for>
</nav>
</div>
</aside>
<section class="chat-main" style="flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #FFFFFF;">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 14px 22px; border-bottom: 1px solid #EEEAF8;">
<h2 style="margin: 0; font-size: 17px; font-weight: 700; color: #16133A;"><span aria-hidden="true" style="color: {{ ch.hashDark }};"># </span>{{ ch.name }}</h2>
<p style="margin: 0; font-size: 13.5px; color: #5B5780;">{{ ch.topic }}</p>
</div>
<div ref="{{ setList }}" style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; padding: 14px 14px 8px;">
<div aria-hidden="true" style="margin-top: auto;"></div>
<sc-for list="{{ msgs }}" as="m" hint-placeholder-count="5">
<sc-if value="{{ m.showDay }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 8px 4px; font-size: 12px; font-weight: 600; color: #5B5780;">
<span aria-hidden="true" style="flex: 1; height: 1px; background: #EEEAF8;"></span>
<span style="padding: 3px 12px; border: 1px solid #EEEAF8; border-radius: 999px; background: #FFFFFF;">{{ m.day }}</span>
<span aria-hidden="true" style="flex: 1; height: 1px; background: #EEEAF8;"></span>
</div>
</sc-if>
<div style="display: flex; gap: 12px; padding: {{ m.pad }} 8px 2px;">
<sc-if value="{{ m.showHead }}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 11px; background: {{ m.color }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600;">{{ m.initials }}</span>
</sc-if>
<sc-if value="{{ m.hideHead }}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="flex: none; width: 36px;"></span>
</sc-if>
<div style="flex: 1; min-width: 0;">
<sc-if value="{{ m.showHead }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0 0 2px; display: flex; align-items: baseline; gap: 8px;"><strong style="font-size: 14.5px; font-weight: 700; color: #16133A;">{{ m.name }}</strong><span style="font-size: 12px; color: #5B5780;">{{ m.time }}</span></p>
</sc-if>
<sc-if value="{{ m.hasText }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #24204A; overflow-wrap: anywhere;">{{ m.text }}</p>
</sc-if>
<sc-if value="{{ m.hasImg }}" hint-placeholder-val="{{ false }}">
<img src="{{ m.imgSrc }}" alt="{{ m.imgAlt }}" width="{{ m.imgW }}" height="{{ m.imgH }}" style="display: block; margin-top: 8px; width: {{ m.imgDw }}px; max-width: 100%; height: auto; aspect-ratio: {{ m.imgAr }}; border-radius: 12px; border: 1px solid #EEEAF8; background: #F5F2FF;">
</sc-if>
<sc-if value="{{ m.hasVid }}" hint-placeholder-val="{{ false }}">
<video src="{{ m.vidSrc }}" poster="{{ m.vidPoster }}" aria-label="{{ m.vidLabel }}" controls="controls" playsinline="playsinline" preload="metadata" style="display: block; margin-top: 8px; width: 240px; max-width: 100%; height: auto; aspect-ratio: 576 / 1024; border-radius: 12px; background: #16133A; object-fit: cover;"></video>
</sc-if>
<sc-if value="{{ m.linkThumb }}" hint-placeholder-val="{{ false }}">
<a href="{{ m.href }}" target="_blank" rel="noopener noreferrer" style="margin-top: 8px; display: flex; flex-direction: column; width: 100%; max-width: 400px; box-sizing: border-box; border: 1px solid #E4E0F5; border-radius: 14px; overflow: hidden; background: #FFFFFF; color: #16133A; text-decoration: none; box-shadow: 0 8px 18px -12px rgba(22,19,58,0.4);">
<img src="{{ m.thumbSrc }}" alt="{{ m.thumbAlt }}" width="{{ m.thumbW }}" height="{{ m.thumbH }}" style="display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: {{ m.thumbFit }}; object-position: {{ m.thumbPos }}; background: {{ m.thumbBg }};">
<span style="display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 14px; border-top: 3px solid #19C37D;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #0B7A4C;">{{ m.linkDesc }}</span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 18px; font-weight: 500; line-height: 1.3; color: #16133A;">{{ m.linkTitle }}</span>
</span>
</a>
</sc-if>
<sc-if value="{{ m.linkPlain }}" hint-placeholder-val="{{ false }}">
<a href="{{ m.href }}" target="_blank" rel="noopener noreferrer" style="margin-top: 8px; display: flex; align-items: center; gap: 12px; width: fit-content; max-width: 100%; box-sizing: border-box; padding: 10px 16px 10px 10px; border: 1px solid #E4E0F5; border-radius: 12px; background: #FBFAFF; color: #16133A; text-decoration: none;">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: {{ m.linkColor }}; color: #16133A; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 14px; font-weight: 600; color: #16133A;">{{ m.linkTitle }}</span><span style="font-size: 12.5px; color: #5B5780;">{{ m.linkDesc }}</span></span>
</a>
</sc-if>
<sc-if value="{{ m.linkPh }}" hint-placeholder-val="{{ false }}">
<span style="margin-top: 8px; display: flex; align-items: center; gap: 12px; width: fit-content; max-width: 100%; box-sizing: border-box; padding: 10px 16px 10px 10px; border: 1.5px dashed #D9D4EE; border-radius: 12px; background: #FBFAFF; color: #16133A;">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: {{ m.linkColor }}; color: #16133A; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 14px; font-weight: 600; color: #16133A;">{{ m.linkTitle }}</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #5B5780;">{{ m.linkDesc }}</span></span>
</span>
</sc-if>
<sc-if value="{{ m.hasPhotos }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; max-width: 460px;">
<sc-for list="{{ m.photos }}" as="ph" hint-placeholder-count="3">
<span style="aspect-ratio: 4 / 5; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 10px; border: 1.5px dashed #C9C3EA; border-radius: 10px; background: {{ ph.bg }}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; line-height: 1.35; color: #3A3666; text-align: center;">{{ ph.label }}</span>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ m.hasRecord }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 8px; display: flex; align-items: center; gap: 16px; width: fit-content; max-width: 100%; box-sizing: border-box; padding: 12px 18px 12px 12px; border: 1px solid #E4E0F5; border-radius: 14px; background: #FBFAFF;">
<span aria-hidden="true" style="flex: none; position: relative; width: 118px; height: 84px;">
<span style="position: absolute; left: 36px; top: 2px; width: 80px; height: 80px; border-radius: 50%; background: repeating-radial-gradient(circle, #1B1840 0 2px, #2C2766 2px 3px); box-shadow: 0 2px 6px rgba(22,19,58,0.3);"></span>
<span style="position: absolute; left: 63px; top: 29px; width: 26px; height: 26px; border-radius: 50%; background: #FF6A47;"></span>
<span style="position: absolute; left: 0; top: 0; width: 84px; height: 84px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 6px; background: #FFCB2E; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.3; color: #16133A; text-align: center; box-shadow: 2px 3px 8px rgba(22,19,58,0.22);">[album art]</span>
</span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 15px; font-weight: 700; color: #16133A;">{{ m.recTitle }}</span>
<span style="font-size: 13.5px; color: #3A3666;">{{ m.recArtist }}</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: #5B5780;">{{ m.recMeta }}</span>
</span>
</div>
</sc-if>
<sc-if value="{{ m.isGif }}" hint-placeholder-val="{{ false }}">
<div class="gifbox" style="margin-top: 8px; position: relative; width: 100%; max-width: 380px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background-color: #FF6A47; display: flex; align-items: center; justify-content: center;">
<span class="fah" style="display: inline-block; font-size: clamp(38px, 5vw, 60px); font-weight: 700; letter-spacing: -0.02em; color: #16133A; text-shadow: 3px 3px 0 #FFCB2E;">FAHHHHH</span>
<span style="position: absolute; left: 10px; bottom: 10px; padding: 2px 7px; border-radius: 5px; background: #16133A; color: #FFFFFF; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;">GIF</span>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>
<form onSubmit="{{ send }}" style="position: relative; padding: 10px 18px 18px;">
<label for="chat-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">Message #{{ ch.name }}</label>
<div class="composer" data-guide="composer" style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border: 1.5px solid #DCD7F2; border-radius: 14px; background: #FFFFFF;">
<input id="chat-input" type="text" value="{{ draft }}" onChange="{{ onDraft }}" placeholder="Message #{{ ch.name }}" autocomplete="off" style="flex: 1; min-width: 0; padding: 9px 0; border: 0; outline: none; background: transparent; font-size: 15px; color: #16133A;">
<button class="cta" type="submit" aria-label="Send message" style="flex: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: {{ sendBg }}; color: #FFFFFF; cursor: pointer; transition: background 140ms ease;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"></path><path d="M21 3l-7 18-4-7-7-4z"></path></svg></button>
</div>
</form>
</section>
</div>
</sc-if>

</main>
</div>
<div aria-hidden="true" style="flex: none; height: 26px; display: flex; align-items: center; justify-content: center;">
<span style="width: min(220px, 40%); height: 8px; background-image: radial-gradient(circle, #3B3670 1.1px, transparent 1.6px); background-size: 6px 6px;"></span>
</div>
</div>

<div ref="{{ setGuide }}" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 60; pointer-events: none; opacity: 0; transition: opacity 300ms ease; will-change: transform;">
<svg width="24" height="24" viewBox="0 0 24 24" style="position: absolute; left: -2px; top: -2px; display: block; filter: drop-shadow(0 2px 3px rgba(10,8,40,0.35));"><path d="M2.5 2.2L2.5 18.6L6.9 14.5L9.8 21L13 19.6L10.2 13.2L16.4 13.2Z" fill="#D63A16" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path></svg>
<div class="mp-label">
<span class="mp-pill" style="white-space: nowrap; padding: 4px 9px; border-radius: 3px 10px 10px 10px; background: #D63A16; color: #FFFFFF; font-size: 12.5px; font-weight: 600; box-shadow: 0 3px 8px rgba(10,8,40,0.3);">a great copywriter</span>
<sc-if value="{{ guideSaying }}" hint-placeholder-val="{{ false }}">
<span class="say" style="display: block; width: max-content; max-width: 230px; padding: 9px 13px; border-radius: 3px 16px 16px 16px; background: #FFFFFF; border: 2px solid #D63A16; color: #16133A; font-size: 14px; font-weight: 500; line-height: 1.35; box-shadow: 0 10px 22px -8px rgba(10,8,40,0.45);">{{ guideSay }}</span>
</sc-if>
</div>
</div>

<div ref="{{ setMe }}" class="mp-me" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 70; pointer-events: none; opacity: 0; will-change: transform;">
<svg width="24" height="24" viewBox="0 0 24 24" style="position: absolute; left: -2px; top: -2px; display: block; filter: drop-shadow(0 2px 3px rgba(10,8,40,0.35));"><path d="M2.5 2.2L2.5 18.6L6.9 14.5L9.8 21L13 19.6L10.2 13.2L16.4 13.2Z" fill="#A21CAF" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path></svg>
<div class="mp-label">
<span class="mp-pill" style="white-space: nowrap; padding: 4px 9px; border-radius: 3px 10px 10px 10px; background: #A21CAF; color: #FFFFFF; font-size: 12.5px; font-weight: 600; box-shadow: 0 3px 8px rgba(10,8,40,0.3);">looking for a great copywriter</span>
</div>
</div>

</div>
</template>

      var step = plan[i];
      var target = null;
      var line = step.say;
      var fx = step.fx;
      var fy = step.fy;
      if (step.sel === "note") {
        target = this.visibleNote();
        if (target) {
          this.noteTipped = true;
        } else {
          target = this.findGuide("notes-chip");
          line = "My notes start at What You Bring. Scroll down.";
          fx = 0.5;
          fy = 0.85;
        }
      } else {
        target = this.findGuide(step.sel);
      }
      var p = this.pointFor(target, fx, fy);
      if (!p) {
        this.guideLater(function () { self.guideStep(); }, 1500);
        return;
      }
      this.guideMove(p.x, p.y, 0, function () {
        self.say(line, 4200);
        self.guideLater(function () { self.guideRest(); }, 4700);
        self.guideLater(function () { self.guideStep(); }, 8500 + Math.random() * 2000);
      });
      return;
    }

    if (all && !this.finaleShown) {
      this.finaleShown = true;
      var m = this.metrics();
      if (!m) return;
      this.guideMove(m.w * 0.5, m.h * 0.42, 0, function () {
        self.say("That's the whole tour. I'd love to talk.", 5200);
        self.guideLater(function () { self.guideRest(); }, 5800);
        self.guideLater(function () { self.guideStep(); }, 20000);
      });
      return;
    }

    if (this.lastNudge) {
      this.lastNudge = false;
      this.guideRest();
      this.guideLater(function () { self.guideStep(); }, all ? 16000 : 9000);
      return;
    }

    this.lastNudge = true;
    var target = this.pickTab();
    var tp = this.pointFor(this.findGuide("tab-" + target), 0.5, 0.72);
    if (!tp) {
      this.guideLater(function () { self.guideStep(); }, 4000);
      return;
    }
    this.guideMove(tp.x, tp.y, 0, function () {
      self.setState({ nudge: target });
      self.say(NUDGE[target][self.visited[target] ? 1 : 0], 4800);
      self.guideLater(function () { self.guideRest(); }, 5400);
      self.guideLater(function () { if (self.state.nudge === target) self.setState({ nudge: "" }); }, 9500);
      self.guideLater(function () { self.guideStep(); }, all ? 18000 : 12000);
    });
  }

  sendMessage(e) {
    if (e && e.preventDefault) e.preventDefault();
    var text = (this.state.draft || "").trim();
    if (!text) return;
    var self = this;
    var id = this.state.channel;
    var sent = Object.assign({}, this.state.sent);
    sent[id] = (sent[id] || []).concat([{ who: "guest", time: nowTime(), text: text }]);
    var first = !this.state.replied[id];
    var replyText = id === "hello" && /start/i.test(text) ? "Still yesterday. Let's talk." : REPLIES[id];
    var replied = Object.assign({}, this.state.replied);
    replied[id] = true;
    this.setState({ sent: sent, draft: "", replied: replied });
    if (first) {
      var t = setTimeout(function () {
        if (!self.alive) return;
        var cur = Object.assign({}, self.state.sent);
        cur[id] = (cur[id] || []).concat([{ who: "ayanna", time: nowTime(), text: replyText }]);
        self.setState({ sent: cur });
      }, 1200);
      this.timers.push(t);
    }
  }

  renderVals() {
    var s = this.state;
    var self = this;

    function tabLook(id) {
      var on = s.tab === id;
      return {
        bg: on ? "#FFFDF7" : "transparent",
        fg: on ? "#16133A" : "#CFCBF2",
        pressed: on ? "true" : "false",
        cls: s.nudge === id && !on ? "nudge" : ""
      };
    }

    function row(i) {
      var on = s.hover === i || (s.hover < 0 && s.active === i);
      var c = ROWS[i];
      return {
        pick: function () { self.setState({ active: self.state.active === i ? -1 : i }); },
        jump: function () { self.jumpTo(i); },
        flash: s.flash && s.flash.i === i ? (s.flash.n % 2 ? "flashA" : "flashB") : "",
        hl: on ? c.on : c.soft,
        border: on ? c.strong : "#E4E0F5",
        shadow: on ? "0 0 0 1px " + c.strong + ", 0 14px 28px -12px " + c.glow : "0 1px 2px rgba(22,19,58,0.06)",
        shift: on ? "-6px" : "0px",
        line: on ? c.strong : "#D9D4EE",
        pressed: s.active === i ? "true" : "false"
      };
    }

    var channels = CHANNELS.map(function (c) {
      var on = c.id === s.channel;
      return {
        id: c.id,
        name: c.name,
        pick: function () { self.setState({ channel: c.id, draft: "" }); },
        bg: on ? "#FFCB2E" : "transparent",
        fg: on ? "#16133A" : "#ECEAFF",
        hashColor: on ? "#16133A" : c.hash,
        fw: on ? "600" : "500",
        pressed: on ? "true" : "false"
      };
    });

    var ch = CHANNELS.filter(function (c) { return c.id === s.channel; })[0] || CHANNELS[0];
    var all = (MESSAGES[ch.id] || []).concat(s.sent[ch.id] || []);
    var msgs = all.map(function (m, i) {
      var p = PEOPLE[m.who] || PEOPLE.guest;
      var prev = all[i - 1];
      var day = m.day || "Today";
      var newDay = !prev || (prev.day || "Today") !== day;
      var head = newDay || prev.who !== m.who || prev.time !== m.time;
      var link = m.link || null;
      var rec = m.record || null;
      return {
        name: p.name,
        initials: p.initials,
        color: p.color,
        time: m.time,
        text: m.text || "",
        hasText: !!m.text,
        showHead: head,
        hideHead: !head,
        pad: head ? "10px" : "2px",
        showDay: newDay,
        day: day,
        linkLive: !!(link && link.href),
        linkThumb: !!(link && link.href && link.thumb),
        linkPlain: !!(link && link.href && !link.thumb),
        thumbSrc: link && link.thumb ? link.thumb.src : "",
        thumbAlt: link && link.thumb ? link.thumb.alt : "",
        thumbW: link && link.thumb ? link.thumb.w : 0,
        thumbH: link && link.thumb ? link.thumb.h : 0,
        thumbPos: link && link.thumb ? link.thumb.pos : "center",
        thumbFit: link && link.thumb && link.thumb.fit ? link.thumb.fit : "cover",
        thumbBg: link && link.thumb && link.thumb.bg ? link.thumb.bg : "#F5F2FF",
        linkPh: !!(link && !link.href),
        href: link && link.href ? link.href : "",
        linkTitle: link ? link.title : "",
        linkDesc: link ? link.desc : "",
        linkColor: link && link.href ? "#C4F2DC" : "#FFE89A",
        hasPhotos: !!(m.photos && m.photos.length),
        photos: (m.photos || []).map(function (label, k) { return { label: label, bg: TILES[k % TILES.length] }; }),
        hasRecord: !!rec,
        recTitle: rec ? rec.title : "",
        recArtist: rec ? rec.artist : "",
        recMeta: rec ? rec.meta : "",
        isGif: !!m.gif,
        hasImg: !!m.img,
        imgSrc: m.img ? m.img.src : "",
        imgAlt: m.img ? m.img.alt : "",
        imgW: m.img ? m.img.w : 0,
        imgH: m.img ? m.img.h : 0,
        imgDw: m.img ? Math.round(m.img.w * Math.min(300 / m.img.w, 300 / m.img.h, 1.25)) : 0,
        imgAr: m.img ? m.img.w + " / " + m.img.h : "auto",
        hasVid: !!m.video,
        vidSrc: m.video ? m.video.src : "",
        vidPoster: m.video ? m.video.poster : "",
        vidLabel: m.video ? m.video.label : ""
      };
    });

    var bg = { doc: "#FFF3CC", web: "#F1EEFF", chat: "#FFFFFF" };

    return {
      t1: tabLook("doc"),
      t2: tabLook("web"),
      t3: tabLook("chat"),
      goDoc: function () { self.setState({ tab: "doc" }); },
      goWeb: function () { self.setState({ tab: "web" }); },
      goChat: function () { self.setState({ tab: "chat" }); },
      showDoc: s.tab === "doc",
      showWeb: s.tab === "web",
      showChat: s.tab === "chat",
      contentBg: bg[s.tab] || bg.doc,
      r0: row(0),
      r1: row(1),
      r2: row(2),
      r3: row(3),
      r4: row(4),
      r5: row(5),
      r6: row(6),
      r7: row(7),
      r8: row(8),
      overDoc: function (e) {
        var t = e && e.target;
        var host = e && e.currentTarget && e.currentTarget.querySelectorAll ? e.currentTarget : (self.rootEl ? self.rootEl.querySelector("article") : null);
        var el = t && t.closest ? t.closest(".hit, .cbtn") : null;
        var idx = -1;
        if (el && host) {
          var list = host.querySelectorAll(el.classList.contains("hit") ? ".hit" : ".cbtn");
          idx = Array.prototype.indexOf.call(list, el);
        }
        if (self.state.hover !== idx) self.setState({ hover: idx });
      },
      leave: function () { if (self.state.hover !== -1) self.setState({ hover: -1 }); },
      channels: channels,
      ch: ch,
      msgs: msgs,
      draft: s.draft,
      onDraft: function (e) { self.setState({ draft: e && e.target ? e.target.value : "" }); },
      send: function (e) { self.sendMessage(e); },
      sendBg: (s.draft || "").trim() ? "#3A4BFF" : "#B9B4DA",
      guideSay: s.say,
      guideSaying: !!s.say,
      setRoot: this.setRoot,
      setMe: this.setMe,
      setGuide: this.setGuide,
      setList: this.setList,
      setContent: this.setContent,
      onMove: this.onMove,
      onLeave: this.onLeave,
      onScroll: this.onScroll
    };
  }
}

</script>
<script>
preact.render(preact.h(Component, {"startTab": "doc"}), document.getElementById("app"));
</script>
